name: iOS IPA for Device Farm (no upload to Apple)

# Same signing as the TestFlight workflow, but only EXPORTS the .ipa and keeps it as a download
# (artifact). Used to run the app on a rented real iPhone (AWS Device Farm) for Apple's screen
# recording. Nothing is uploaded to App Store Connect. Manual only (Actions > Run workflow).
# By default it builds the exact code of build 2 (tag ios-build-2) that Apple is reviewing.
#
# Uses the same secrets as ios-testflight.yml (APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8,
# DIST_CERT_P12, DIST_CERT_PASSWORD, PROFILE_EVENTSRUS, RC_API_KEY_IOS, GOOGLE_SERVICE_INFO_PLIST_BASE64)
# and the variables GOOGLE_IOS_CLIENT_ID, BACKEND_BASE_URL, WEB_BASE_URL.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git tag, branch or commit to build (default: the build 2 tag Apple is reviewing)'
        required: false
        default: 'ios-build-2'

env:
  BUNDLE_ID: com.eventsrus.eventsrusui

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      RC_KEY_IOS: ${{ secrets.RC_API_KEY_IOS }}
      GSI_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
    steps:
      - name: Check that the Apple secrets exist
        env:
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          P12: ${{ secrets.DIST_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.PROFILE_EVENTSRUS }}
        run: |
          missing=""
          [ -n "$TEAM_ID" ]      || missing="$missing APPLE_TEAM_ID"
          [ -n "$KEY_ID" ]       || missing="$missing ASC_KEY_ID"
          [ -n "$ISSUER_ID" ]    || missing="$missing ASC_ISSUER_ID"
          [ -n "$KEY_P8" ]       || missing="$missing ASC_KEY_P8"
          [ -n "$P12" ]          || missing="$missing DIST_CERT_P12"
          [ -n "$P12_PASSWORD" ] || missing="$missing DIST_CERT_PASSWORD"
          [ -n "$PROFILE" ]      || missing="$missing PROFILE_EVENTSRUS"
          [ -n "$RC_KEY_IOS" ]   || missing="$missing RC_API_KEY_IOS"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Select the newest Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::No Xcode 26 on this runner"; ls /Applications | grep -i xcode; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Save the App Store Connect API key
        env:
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: flutter pub get

      - name: Optional files (Firebase plist, Google client id)
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
        run: |
          if [ -n "$GSI_PLIST_B64" ]; then
            echo "$GSI_PLIST_B64" | base64 --decode > ios/Runner/GoogleService-Info.plist
            (cd ios && ruby -e '
              require "xcodeproj"
              proj = Xcodeproj::Project.open("Runner.xcodeproj")
              target = proj.targets.find { |t| t.name == "Runner" }
              group = proj.main_group["Runner"]
              ref = group.new_file("GoogleService-Info.plist")
              target.resources_build_phase.add_file_reference(ref)
              proj.save
            ')
          fi
          sh tool/write_google_xcconfig.sh "$GOOGLE_IOS_CLIENT_ID"

      - name: Prepare the Flutter build (no compile yet)
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL || 'https://api.eventsrus.app' }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL || 'https://eventsrus.app' }}
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
        run: |
          flutter build ios --config-only --release --no-codesign \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=BACKEND_BASE_URL="$BACKEND_BASE_URL" \
            --dart-define=WEB_BASE_URL="$WEB_BASE_URL" \
            --dart-define=RC_API_KEY_IOS="$RC_KEY_IOS" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="$GOOGLE_IOS_CLIENT_ID"

      - name: Install the distribution certificate and App Store profile
        env:
          P12: ${{ secrets.DIST_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.PROFILE_EVENTSRUS }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          PNAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")")
          echo "PROFILE_NAME=$PNAME" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KC"

      - name: Archive (unsigned, Xcode 26)
        working-directory: ios
        run: |
          xcodebuild archive \
            -workspace Runner.xcworkspace -scheme Runner -configuration Release \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Export the IPA (no upload)
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: eventsrus-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 3

      - name: Remove the keys and Firebase file from the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/dist.p12" ios/Runner/GoogleService-Info.plist
