name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the exact version verified locally all session, rather
      # than floating on channel: stable - that previously resolved to
      # 3.47.7 (current stable as of this writing) against a local dev
      # environment verified only on 3.44.9, and flutter analyze failed in
      # CI under the newer SDK for reasons never reproduced locally.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
