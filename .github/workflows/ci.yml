name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # --no-fatal-infos: flutter analyze exits 1 on ANY issue by default,
      # info-level included - this codebase has 62 pre-existing info-level
      # lints (use_build_context_synchronously, use_null_aware_elements,
      # curly_braces_in_flow_control_structures), none of them errors, all
      # already accepted as the working baseline throughout this session
      # (every verification this session checked "any new errors?", not
      # "zero issues"). Without this flag the very first CI run already
      # fails on pre-existing style suggestions unrelated to any change.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test
